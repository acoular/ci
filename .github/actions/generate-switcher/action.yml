name: Generate Switcher JSON

description: >
  Generate a pydata-sphinx-theme switcher.json from git tags.
  Writes dev and release entries for one package documentation path.

inputs:
  package-path:
    description: >
      Package documentation path, e.g. /acoular or /spectacoular.
    required: false
    default: '/acoular'
  min-version:
    description: 'Oldest tag to include, e.g. v26.01. Empty string includes all tags.'
    required: false
    default: ''
  output:
    description: 'Output path for switcher.json, relative to repo root'
    required: false
    default: 'docs/source/_static/switcher.json'

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        clean: false
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
    - name: Generate switcher.json
      shell: bash
      run: |
        uv run --group docs python -m acoular_sphinx.scripts.generate_switcher \
          --output "${{ inputs.output }}" \
          --package-path "${{ inputs.package-path }}" \
          --min-version "${{ inputs.min-version }}" \
          --repo-path "."

        echo "Generated ${{ inputs.output }} with the centralized generator"
        ls -lh "${{ inputs.output }}"
