name: Conda 🐍 Build 🛠️ & Deploy
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        default: false
        type: boolean
    secrets:
      ANACONDA_TOKEN:
        required: false

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
      - name: Install conda-build
        run: conda install --yes -n base conda-build
      - name: Check out a copy of the repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Build package
        run: |
          export VERSION=$(uvx hatchling version)  # use hatch-vcs here until uv supports dynamic versions. track: https://github.com/astral-sh/uv/issues/14137
          conda run -n base conda build --channel acoular --channel conda-forge --no-anaconda-upload --no-copy-test-source-files recipe.local --output-folder ./conda-pkg
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conda-build
          path: conda-pkg/

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: conda-build
          path: conda-pkg/
      - name: Install anaconda-client
        run: conda install --yes -n base anaconda-client
      - name: Upload conda package to Anaconda Cloud
        run: |
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "::error::ANACONDA_TOKEN is not configured for the anaconda environment."
            exit 1
          fi
          conda run --no-capture-output -n base anaconda --verbose login --at anaconda.org --token "$ANACONDA_TOKEN"
          conda run --no-capture-output -n base anaconda --verbose upload ./conda-pkg/noarch/*.conda
