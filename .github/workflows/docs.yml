name: Docs 📝 Build 🛠️ & Deploy
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      deploy:
        required: false
        default: false
        type: boolean
      html_baseurl:
        required: false
        default: ''
        type: string
      docs_version_match:
        required: false
        default: ''
        type: string
      artifact_name:
        required: false
        default: 'build-docs'
        type: string
      artifact_path:
        required: false
        default: './docs/build/html'
        type: string
      setup_portaudio:
        description: 'Whether PortAudio should be installed.'
        type: boolean
        required: false
        default: true
      package:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string
      min_version:
        required: false
        default: ''
        type: string
      deploy_switcher:
        required: false
        default: false
        type: boolean
    secrets:
      website_gh_pages_token:
        required: false

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ vars.LATEST_PYTHON_VERSION }}
      - name: Set up Pandoc  # for AcouPipe
        uses: acoular/ci/.github/actions/setup-pandoc@main
        with:
          os: ${{ matrix.os }}
      - name: Set up PortAudio
        if: ${{ inputs.setup_portaudio }}
        uses: acoular/ci/.github/actions/setup-portaudio@main
        with:
          os: ${{ matrix.os }}
      - name: Set up Graphviz
        uses: acoular/ci/.github/actions/setup-graphviz@main
        with:
          os: ${{ matrix.os }}
      - name: Run sphinx
        env:
          DOCS_BASEURL: ${{ inputs.html_baseurl }}
          DOCS_VERSION_MATCH: ${{ inputs.docs_version_match }}
        run: uv run --frozen --exact --group docs make -C docs html
      - name: Upload artifacts
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy target
        id: target
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$PACKAGE" ]; then
            echo "::error::Provide package when deploy=true"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "deploy_path=./payload/$PACKAGE${VERSION:+/$VERSION}" >> "$GITHUB_OUTPUT"
      - name: Prepare payload
        run: mkdir -p "${{ steps.target.outputs.deploy_path }}"
      - name: Generate switcher.json
        if: ${{ inputs.deploy_switcher }}
        uses: acoular/ci/.github/actions/generate-switcher@main
        with:
          package-path: ${{ steps.target.outputs.package }}
          min-version: ${{ inputs.min_version }}
          output: "payload/${{ steps.target.outputs.package }}/_static/switcher.json"
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: "${{ steps.target.outputs.deploy_path }}"
      - name: Deploy package documentation to website gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          external_repository: acoular/website
          publish_branch: gh-pages
          personal_token: ${{ secrets.website_gh_pages_token }}
          publish_dir: payload/${{ steps.target.outputs.package }}
          destination_dir: ${{ steps.target.outputs.package }}
          keep_files: true
          enable_jekyll: false
