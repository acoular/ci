name: Tests
on:
  workflow_call:
    inputs:
      src_dir:
        description: 'The path to the src directory.'
        type: string
        required: false
        default: ${{ github.event.repository.name }}
      setup_portaudio:
        description: 'Whether PortAudio should be installed.'
        type: boolean
        required: false
        default: true

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(vars.SUPPORTED_PYTHON_VERSIONS) }}
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up PortAudio
        if: ${{ inputs.setup_portaudio }}
        uses: acoular/ci/.github/actions/setup-portaudio@main
        with:
          os: ${{ matrix.os }}
      - name: List env
        run: |
          uv sync --frozen && uv pip list
      - name: Run smoke tests
        uses: acoular/ci/.github/actions/smoke-tests@main
        with:
          command: uv run --frozen --no-dev --exact
      - name: Run unit tests
        run: uv run --frozen --exact --group tests python -m pytest -v
      - name: Run doctests
        run: uv run --frozen --exact --group tests python -m pytest -v --doctest-modules ${{ inputs.src_dir }}
