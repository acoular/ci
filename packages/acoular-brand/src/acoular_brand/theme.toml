# The single editable source for Acoular colours.

[colors]
brand = "#0c3762"
brand-light = "#fbf4d7"
success = "#005b46"
warning = "#d9a21b"
danger = "#a81d1e"
secondary-light = "#935160"
secondary-dark = "#5e2132"
accent = "#3cc5d0"
highlight = "#ffa1d7"
muted-light = "#b6bdce"
muted = "#8b93a5"
muted-dark = "#626a7c"
background-light = "#f5f9ff"
background-dark = "#061525"

[light]
brand = "brand"
accent = "success"
hover = "highlight"
on_brand = "background-light"
background = "background-light"
surface = "background-light"
text = "background-dark"
muted = "background-dark"
border = "muted-light"
warning = "warning"
danger = "danger"

[dark]
brand = "brand-light"
accent = "muted-dark"
hover = "highlight"
on_brand = "background-dark"
background = "background-dark"
surface = "background-dark"
text = "muted-light"
muted = "muted-light"
border = "muted-dark"
warning = "warning"
danger = "danger"

[plot]
# Acoular's qualitative palette, omitting only background colours.
colors = [
    "warning",
    "danger",
    "secondary-dark",
    "secondary-light",
    "success",
    "brand",
    "highlight",
    "muted-light",
    "muted",
    "muted-dark",
    "accent",
]
