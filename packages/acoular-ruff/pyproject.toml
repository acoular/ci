[project]
name = "acoular-ruff"
version = "0.1.0"
description = "Common ruff configuration for the Acoular organization"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Acoular Development Team", email = "info@acoular.org"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
dependencies = [
    "ruff==0.15.16",
]

[build-system]
requires = ["hatchling>=1.15"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoular_ruff"]
shared-data = { "ruff.acoular.toml" = "share/ruff/ruff.acoular.toml" }

[tool.hatch.build.targets.sdist]
include = ["src/acoular_ruff", "README.md", "ruff.acoular.toml"]
