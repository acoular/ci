[project]
name = "acoular-sphinx"
version = "0.1.0"
description = "Shared Sphinx helpers for the Acoular organization website and package docs"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Acoular Development Team", email = "info@acoular.org"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
dependencies = []

[build-system]
requires = ["hatchling>=1.15"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoular_sphinx"]

[tool.hatch.build.targets.sdist]
include = ["src/acoular_sphinx", "README.md"]
