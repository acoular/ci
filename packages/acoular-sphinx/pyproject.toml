[project]
name = "acoular-sphinx"
version = "0.1.4"
description = "Shared Sphinx helpers for the Acoular organization website and package docs"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Acoular Development Team", email = "info@acoular.org"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
dependencies = [
    "acoular-brand @ git+https://github.com/acoular/ci.git@brand-v1.1#subdirectory=packages/acoular-brand",
    "graphviz>=0.21",
    "ipython>=9.14.1",
    "matplotlib>=3.10.9",
    "numpydoc>=1.10.0",
    "pydata-sphinx-theme>=0.18.0",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-gallery>=0.21.0",
    "sphinxcontrib-bibtex>=2.7.0",
    "traits",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
traits = { git = "https://github.com/enthought/traits.git", branch = "main" }
