[project]
name = "acoular-ci-workspace"
version = "0.1.0"
description = "Workspace root for shared Acoular CI tooling"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Acoular Development Team", email = "info@acoular.org"},
]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[build-system]
requires = ["hatchling>=1.15"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoular_ci_workspace"]

[tool.hatch.build.targets.sdist]
include = ["src/acoular_ci_workspace", "README.md"]

[tool.uv.workspace]
members = ["packages/*"]
