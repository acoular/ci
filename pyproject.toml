[project]
name = "acoular-ci"
version = "0.1.0"
description = "Common CI and development configuration for the Acoular Organization"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Acoular Development Team", email = "info@acoular.org"},
]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling (>=1.15)"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
shared-data = { "ruff.acoular.toml" = "share/ruff/ruff.acoular.toml" }
